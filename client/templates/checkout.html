{% extends 'base.html' %}

{% block title %}Compra Exitosa - MusicBox{% endblock %}

    <h1 style="color: #4CAF50; font-size: 3rem;">¡Compra Exitosa!</h1>
    <p style="font-size: 1.2rem; margin-top: 1rem;">Gracias por tu compra en MusicBox.</p>

</div>
{% endblock %}

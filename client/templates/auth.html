{% extends 'base.html' %}

{% block title %}Ingresar / Registrarse - MusicBox{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        {% if error %}
            <div style="background:#ffcccc; color:red; padding:10px; margin-bottom:15px; border-radius:4px;">
                {{ error }}
            </div>
        {% endif %}

        <div class="tabs">
            <div class="tab {% if active_tab == 'login' %}active{% endif %}" onclick="showTab('login')">Ingresar</div>
            <div class="tab {% if active_tab == 'signup' %}active{% endif %}" onclick="showTab('signup')">Registrarse</div>
        </div>

        <!-- Formulario Login -->
        <div id="login-form" style="display: {% if active_tab == 'login' %}block{% else %}none{% endif %};">
            <form action="{{ url_for('auth') }}" method="POST">
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Iniciar Sesión</button>
            </form>
        </div>

        <!-- Formulario Registro -->
        <div id="signup-form" style="display: {% if active_tab == 'signup' %}block{% else %}none{% endif %};">
            <form action="{{ url_for('auth') }}" method="POST">
                <input type="hidden" name="action" value="signup">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="fname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" name="lastname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" name="cpassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>¿Qué tipo de usuario eres?</label>
                    <select name="role" class="form-control" required>
                        <option value="client">Cliente (Quiero comprar)</option>
                        <option value="seller">Vendedor (Quiero vender)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Registrarme</button>
            </form>
        </div>
    </div>
</div>

<script>
    function showTab(tabName) {
        if(tabName === 'login') {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('signup-form').style.display = 'none';
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.querySelectorAll('.tab')[1].classList.remove('active');
        } else {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
            document.querySelectorAll('.tab')[0].classList.remove('active');
            document.querySelectorAll('.tab')[1].classList.add('active');
        }
    }
</script>
{% endblock %}

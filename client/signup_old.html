{% extends "navbar.html" %}

{& block title &} Nosotros {% endblock %}

{%block contend%}

    <article>
        <h1>Registro</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form class="form signup" action="/signup" method="POST" novalidate>

            <div class="form_group">
                <label for="fname">Nombre: </label><br>
                <input type="text" id="fname" name="fname" placeholder="Tu nombre" required autofocus aria-label="Nombre"><br>
            </div>
            <div class="form_group">
                <label for="lastname">Apellido: </label><br>
                <input type="text" id="lastname" name="lastname" placeholder="Tu apellido" aria-label="Apellido"><br>
            </div>
            <div class="form_group">
                <label for="email">Email: </label><br>
                <input type="email" id="email" name="email" placeholder="name@mail.com" required autofocus aria-label="Email"><br>
            </div>
            <div class="form_group">
                <label for="password">Contraseña: </label><br>
                <input type="password" id="password" name="password" placeholder="Tu Contraseña" required aria-label="Contraseña"><br>
            </div>
            <div class="form_group">
                <label for="cpassword">Confirmar contraseña: </label><br>
                <input type="password" id="cpassword" name="cpassword" placeholder="Confirma tu contraseña" required aria-label="Contraseña"><br>
            </div>

            <div class="form_actions">
                <input class="submit" type="submit" value="Entrar">
            </div>

            <div class="form_links">
                <a href="/login">¿Ya tienes cuenta? Iniciar sesión</a>
            </div>

        </form>
    </article>

{% endblock %}
